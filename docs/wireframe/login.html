<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 | 딱맞닥</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- JSP 전환 시: /WEB-INF/views/common/header.jsp 로 분리 (로그인 여부는 세션으로 분기) -->
<header class="site-header">
  <div class="container-xl inner d-flex align-items-center justify-content-between gap-4">
    <a href="index.html" class="brand"><span class="brand-mark">+</span>딱맞닥</a>
    <nav class="main-nav d-flex gap-4" aria-label="주 메뉴"><a href="doctor-list.html">진료과·의사 찾기</a><a href="symptom-result.html">증상으로 찾기</a><a href="reservation-list.html">내 예약</a></nav>
    <div class="d-flex align-items-center gap-2"><a href="login.html" class="btn btn-line btn-sm">로그인</a><a href="signup.html" class="btn btn-primary btn-sm">회원가입</a></div>
  </div>
</header>
<main class="page">
  <div class="container-xl">

    <div class="card-w auth-card">
      <div class="d-flex align-items-center gap-2 mb-4"><h1 style="font-size:26px">로그인</h1><span class="fr">FR-03</span><span class="fr">FR-30</span></div>
      <!-- 로그인이 필요한 화면에서 넘어왔을 때만 표시 (예: login.html?redirect=reserve.html). 로그인 후 그 화면으로 돌아감 -->
      <div id="redirectNotice" class="notice mb-3" hidden><strong>로그인이 필요한 서비스예요.</strong> 로그인하면 보던 화면으로 바로 돌아가요. <span class="fr">FR-04</span></div>
      <form action="main.html" method="post" class="d-flex flex-column gap-3">
        <div class="seg" role="tablist" aria-label="로그인 유형"><button type="button" role="tab" aria-selected="true" class="active" data-type="MEMBER">회원</button><button type="button" role="tab" aria-selected="false" data-type="ADMIN">관리자</button></div>
        <input type="hidden" id="loginType" name="loginType" value="MEMBER">
        <div><label for="lid" class="form-label">아이디</label><input id="lid" name="userId" type="text" class="form-control" autocomplete="username" required></div>
        <div><label for="lpw" class="form-label">비밀번호</label><input id="lpw" name="password" type="password" class="form-control" autocomplete="current-password" required></div>
        <button type="submit" class="btn btn-primary btn-lg">로그인</button>
      </form>
      <p class="text-center small text-muted-w mt-3 mb-3">아직 회원이 아니신가요? <a href="signup.html">회원가입</a></p>
      <p class="small-note text-center p-3 rounded-3" style="background:var(--bg)">진료 예약·예약 내역·마이페이지는 로그인 후 이용할 수 있어요.</p>
    </div>
  </div>
</main>
<button type="button" id="frToggle" class="btn btn-line btn-sm fr-toggle">요구사항 번호 숨기기</button>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
